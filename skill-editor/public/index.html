<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One2X Skill · 可视化预览</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- 品牌字 Nohemi：来自 medeo-fe 真实字体文件（变量字重 100–900），让 Display / Headline 用真字体渲染 -->
    <style>
      @font-face {
        font-family: 'Nohemi';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/Nohemi-VF.ttf') format('truetype');
      }
      @font-face {
        font-family: 'o2x-icons';
        font-style: normal;
        font-weight: normal;
        font-display: block;
        src: url('/fonts/o2x-icons.woff2') format('woff2');
      }
    </style>
    <!-- tokens.css 会被注入到这里之后，使本页直接吃 One2X 变量 -->
    <style id="tokens"></style>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--font-family-plain, "Manrope", system-ui, sans-serif);
        background: var(--color-surface-background, #f4f4f5);
        color: var(--color-surface-on-surface, #09090b);
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; }
      ::selection { background: color-mix(in srgb, var(--color-schemes-primary) 24%, transparent); }

      .layout { display: grid; grid-template-columns: 256px 1fr; min-height: 100vh; }

      /* ---------- Sidebar ---------- */
      .sidebar {
        position: sticky; top: 0; align-self: start; height: 100vh;
        display: flex; flex-direction: column;
        background: var(--color-surface-surface-container-lowest, #fff);
        border-right: 0.5px solid var(--color-surface-outline-variant, #e4e4e7);
        padding: var(--space-s6, 24px) var(--space-s4, 16px);
      }
      .logo { display: flex; align-items: center; gap: var(--space-s3, 12px); margin-bottom: var(--space-s6, 24px); }
      .logo .mark {
        width: 36px; height: 36px; border-radius: var(--shape-radius-12, 12px);
        background: var(--color-surface-inverse-surface, #09090b);
        display: grid; place-items: center; color: var(--color-surface-inverse-on-surface, #fff);
        font-weight: 800; font-size: 18px; flex: none;
        box-shadow: 0 8px 20px color-mix(in srgb, var(--color-surface-inverse-surface) 28%, transparent);
      }
      .logo .mark svg { width: 26px; height: 26px; display: block; }
      .logo h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
      .logo p { margin: 2px 0 0; font-size: 11px; color: var(--color-surface-on-surface-variant); }

      .nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
      .nav-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--color-surface-on-surface-variant); padding: var(--space-s4) var(--space-s2) var(--space-s1); }
      .nav a {
        display: flex; align-items: center; gap: var(--space-s3, 12px);
        padding: var(--space-s2, 8px) var(--space-s3, 12px); border-radius: var(--shape-radius-8, 8px);
        font-size: 13px; font-weight: 600; color: var(--color-surface-on-surface-variant);
        text-decoration: none; transition: background 150ms ease, color 150ms ease;
      }
      .nav a:hover { background: var(--color-surface-background); color: var(--color-surface-on-surface); }
      .nav a.active { background: color-mix(in srgb, var(--color-surface-inverse-surface) 10%, transparent); color: var(--color-surface-on-surface); font-weight: 700; }
      .nav a .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .55; flex: none; }
      .nav a .nav-ico { flex: none; width: 18px; font-family: 'o2x-icons'; font-size: 18px; line-height: 1; text-align: center;
        color: currentColor; opacity: .8; -webkit-font-smoothing: antialiased; }
      .nav a.active .nav-ico { opacity: 1; }

      .theme-toggle { margin-top: auto; display: flex; gap: 4px; padding: 4px; border-radius: var(--shape-radius-full);
        background: var(--color-surface-background); }
      .theme-toggle button { flex: 1; border: 0; background: transparent; padding: var(--space-s2); border-radius: var(--shape-radius-full);
        font: inherit; font-size: 12px; font-weight: 600; color: var(--color-surface-on-surface-variant); cursor: pointer; }
      .theme-toggle button.active { background: var(--color-surface-surface-container-lowest); color: var(--color-surface-on-surface);
        box-shadow: 0 1px 3px rgba(0,0,0,.12); }

      /* ---------- Content ---------- */
      .content { padding: clamp(24px, 5vw, 64px); max-width: 1080px; width: 100%; }
      .hero { margin-bottom: var(--space-s10, 64px); }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
        color: var(--color-schemes-primary); margin: 0 0 var(--space-s3); }
      .hero h2 { margin: 0 0 var(--space-s4); font-family: var(--font-family-brand, var(--font-family-plain));
        font-size: clamp(34px, 6vw, 56px); line-height: 1.02; font-weight: 800; letter-spacing: -0.03em; }
      .hero p { margin: 0; max-width: 60ch; font-size: 17px; line-height: 1.6; color: var(--color-surface-on-surface-variant); }

      /* 获取 / 安装 */
      .install { display: flex; align-items: center; justify-content: space-between; gap: var(--space-s5);
        margin-bottom: var(--space-s10, 64px); padding: var(--space-s5) var(--space-s6);
        background: var(--color-surface-surface-container-lowest, #fff);
        border: 0.5px solid var(--color-surface-outline-variant, #e4e4e7);
        border-radius: var(--shape-radius-20, 20px); flex-wrap: wrap; }
      .install-main { flex: 1; min-width: 280px; }
      .install-title { font-size: 15px; font-weight: 700; }
      .install-desc { margin: var(--space-s2) 0 var(--space-s4); font-size: 13px; line-height: 1.6;
        color: var(--color-surface-on-surface-variant); max-width: 70ch; }
      .install-cmd { display: flex; align-items: stretch; gap: var(--space-s2); flex-wrap: wrap; }
      .install-code { flex: 1; min-width: 240px; display: flex; align-items: center;
        background: var(--color-surface-background); border: 0.5px solid var(--color-surface-outline-variant);
        border-radius: var(--shape-radius-8); padding: var(--space-s2) var(--space-s3); font-size: 12.5px;
        color: var(--color-surface-on-surface); overflow-x: auto; white-space: nowrap; }
      .copy-btn { flex: none; border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 700;
        border-radius: var(--shape-radius-8); padding: var(--space-s2) var(--space-s4);
        background: var(--color-surface-inverse-surface); color: var(--color-surface-inverse-on-surface);
        transition: transform 120ms ease, background 150ms ease; }
      .copy-btn:active { transform: scale(0.96); }
      .copy-btn.done { background: #15803d; }
      .install-link { display: inline-flex; align-items: center; gap: 8px; flex: none; text-decoration: none;
        font-size: 13px; font-weight: 700; padding: var(--space-s3) var(--space-s5);
        border-radius: var(--shape-radius-full); border: 0.5px solid var(--color-surface-outline);
        background: var(--color-surface-surface-container-lowest); color: var(--color-surface-on-surface);
        transition: background 150ms ease, transform 150ms ease; }
      .install-link:hover { background: var(--color-surface-background); transform: translateY(-1px); }
      .install-link .ext { color: var(--color-surface-on-surface-variant); }
      @media (max-width: 720px) { .install { flex-direction: column; align-items: stretch; } .install-link { justify-content: center; } }

      /* 可复制 prompt */
      .prompt { display: flex; align-items: center; gap: var(--space-s2); margin-top: var(--space-s3);
        background: var(--color-surface-background);
        border: 0.5px solid var(--color-surface-outline-variant);
        border-radius: var(--shape-radius-8); padding: var(--space-s2) var(--space-s3); }
      .prompt-tag { flex: none; font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
        color: var(--color-surface-on-surface-variant); }
      .prompt-text { flex: 1; min-width: 0; font-size: 11.5px; line-height: 1.5; color: var(--color-surface-on-surface);
        font-family: ui-monospace, Menlo, monospace; background: transparent; padding: 0; white-space: normal; }
      .prompt-copy { flex: none; align-self: flex-start; cursor: pointer; font: inherit; font-size: 11px; font-weight: 700;
        border-radius: var(--shape-radius-6); padding: 4px 10px; background: var(--color-surface-surface-container-highest);
        color: var(--color-surface-on-surface); border: 0.5px solid var(--color-surface-outline-variant);
        transition: transform 120ms ease, background 150ms ease; }
      .prompt-copy:hover { background: var(--color-surface-surface-container-high); }
      .prompt-copy:active { transform: scale(0.95); }
      .prompt-copy.done { background: var(--color-surface-inverse-surface); color: var(--color-surface-inverse-on-surface); border-color: transparent; }

      section.block { margin-bottom: var(--space-s10, 64px); scroll-margin-top: 24px; }
      .sec-head { margin-bottom: var(--space-s6, 24px); }
      .sec-head h3 { margin: 0 0 var(--space-s2); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
      .sec-head p { margin: 0; max-width: 64ch; color: var(--color-surface-on-surface-variant); line-height: 1.6; }

      .card {
        background: var(--color-surface-surface-container-lowest, #fff);
        border: 0.5px solid var(--color-surface-outline-variant, #e4e4e7);
        border-radius: var(--shape-radius-20, 20px);
        padding: var(--space-s6, 24px);
      }
      .grid { display: grid; gap: var(--space-s4, 16px); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--shape-radius-full);
        font-size: 11px; font-weight: 600; background: var(--color-surface-background); color: var(--color-surface-on-surface-variant); }
      .pill.good { background: color-mix(in srgb, #15803d 14%, transparent); color: #15803d; }
      .pill.bad { background: color-mix(in srgb, var(--color-schemes-error) 14%, transparent); color: var(--color-schemes-error); }

      .btn { border: 0.5px solid var(--color-surface-outline); background: var(--color-surface-surface-container-lowest);
        color: var(--color-surface-on-surface); border-radius: var(--shape-radius-full); padding: var(--space-s2) var(--space-s4);
        font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: transform 120ms ease, background 150ms ease; }
      .btn:hover { background: var(--color-surface-background); }
      .btn:active { transform: scale(0.97); }
      .btn.primary { background: var(--color-surface-inverse-surface); color: var(--color-surface-inverse-on-surface); border-color: transparent; }

      /* ---------- Color ---------- */
      .swatch-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .swatch { border-radius: var(--shape-radius-16); overflow: hidden; border: 0.5px solid var(--color-surface-outline-variant); background: var(--color-surface-surface-container-lowest); }
      .swatch .chip { height: 84px; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
      .swatch .meta { padding: var(--space-s3); }
      .swatch .meta .nm { font-size: 12px; font-weight: 600; }
      .swatch .meta .hex { font-size: 11px; color: var(--color-surface-on-surface-variant); margin-top: 2px; }
      .group-title { font-size: 13px; font-weight: 700; color: var(--color-surface-on-surface-variant);
        margin: var(--space-s7) 0 var(--space-s3); }
      .group-title:first-child { margin-top: 0; }
      .mini-title { font-size: 12px; font-weight: 600; color: var(--color-surface-on-surface-variant); margin-bottom: var(--space-s3); }
      code { font-family: ui-monospace, Menlo, monospace; font-size: .86em; background: var(--color-surface-background);
        padding: 1px 6px; border-radius: 5px; }

      /* 用色配对 */
      .usage-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: stretch; }
      .usage {
        display: grid;
        grid-template-rows: 116px minmax(58px, auto) auto;
        gap: var(--space-s3);
        padding: var(--space-s4);
        height: 100%;
      }
      .u-demo { border-radius: var(--shape-radius-12); padding: var(--space-s5); display: grid; place-items: center; min-height: 0; height: 116px; }
      .u-btn { border: 0; border-radius: var(--shape-radius-full); padding: var(--space-s2) var(--space-s5); font: inherit; font-weight: 700; font-size: 13px; cursor: default; }
      .u-card { border: 0.5px solid; border-radius: var(--shape-radius-12); padding: var(--space-s3) var(--space-s4); width: 100%; }
      .u-snack { border-radius: var(--shape-radius-full); padding: var(--space-s3) var(--space-s4); font-size: 13px; font-weight: 600; }
      .u-cap { font-size: 12px; line-height: 1.55; color: var(--color-surface-on-surface-variant); }
      .u-cap b { color: var(--color-surface-on-surface); }
      .usage .prompt {
        align-self: end;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
        row-gap: 6px;
        column-gap: var(--space-s2);
        min-height: 100px;
        margin-top: 0;
      }
      .usage .prompt-tag { justify-self: start; }
      .usage .prompt-text { grid-column: 1 / -1; font-size: 11px; line-height: 1.45; }
      .usage .prompt-copy { align-self: start; }
      @media (max-width: 980px) { .usage-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 640px) { .usage-grid { grid-template-columns: 1fr; } }

      /* 角色族 */
      .role-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
      .role-card { display: flex; flex-direction: column; gap: var(--space-s3); padding: var(--space-s4); }
      .role-head { margin-bottom: var(--space-s3); }
      .role-nm { font-size: 15px; font-weight: 700; }
      .role-use { display: block; font-size: 12px; color: var(--color-surface-on-surface-variant); margin-top: 2px; }
      .role-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-s2); }
      .ctile { border: 0.5px solid; border-radius: var(--shape-radius-12); padding: var(--space-s3); min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; }
      .ctile-aa { font-size: 20px; font-weight: 800; }
      .ctile-nm { font-size: 12px; font-weight: 700; }
      .ctile-hex { font-size: 10px; opacity: .85; margin-top: 2px; }
      .ctile-hex span { opacity: .7; }
      .role-rules { display: grid; gap: 6px; margin-top: 2px; font-size: 11.5px; line-height: 1.45; color: var(--color-surface-on-surface-variant); }
      .role-rules div { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: var(--space-s2); padding-top: 6px; border-top: 0.5px solid var(--color-surface-outline-variant); }
      .role-rules b { color: var(--color-surface-on-surface); font-size: 11px; }
      .role-rules .avoid b { color: var(--color-schemes-error); }
      .role-card .prompt { margin-top: auto; }

      /* 色板 */
      .pal-row { display: flex; align-items: center; gap: var(--space-s3); padding: var(--space-s1) 0; }
      .pal-name { width: 120px; flex: none; font-size: 13px; font-weight: 600; }
      .pal-ramp { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0; flex: 1; height: 44px;
        border-radius: var(--shape-radius-8); overflow: hidden; border: 0.5px solid var(--color-surface-outline-variant); }
      .tone { display: grid; place-items: center; font-size: 10px; font-weight: 600; }

      /* 表面层级 */
      .surface-grid { grid-template-columns: 1fr 1fr; }
      .surf-row { display: flex; align-items: center; gap: var(--space-s3); padding: 5px 0; }
      .surf-chip { width: 40px; height: 28px; border-radius: var(--shape-radius-6); border: 0.5px solid; flex: none; }
      .surf-nm { flex: 1; font-size: 13px; }
      .surf-hex { font-size: 11px; color: var(--color-surface-on-surface-variant); }
      .nest { border: 0.5px solid; border-radius: var(--shape-radius-12); padding: var(--space-s3); font-size: 12px; font-weight: 600; margin-top: var(--space-s2); }

      /* 状态层 */
      .state-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
      .st-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-s2); }
      .st-chip { position: relative; isolation: isolate; overflow: hidden; height: 60px; border-radius: var(--shape-radius-8);
        display: grid; place-items: center; font-size: 11px; font-weight: 700; }
      .st-ov { position: absolute; inset: 0; }
      .st-lab { position: relative; z-index: 1; }

      @media (max-width: 720px) { .surface-grid { grid-template-columns: 1fr; } .pal-name { width: 84px; } }

      /* 组件 */
      .cov-row { padding: var(--space-s3) 0; border-top: 0.5px solid var(--color-surface-outline-variant); }
      .cov-row:first-of-type { border-top: 0; }
      .cov-head { display: flex; align-items: center; gap: var(--space-s2); font-size: 13px; margin-bottom: var(--space-s2); flex-wrap: wrap; }
      .cov-note { color: var(--color-surface-on-surface-variant); font-size: 12px; }
      .cov-dot { width: 8px; height: 8px; border-radius: var(--shape-radius-full); flex: none; }
      .cov-dot.live, .comp-chip.live { }
      .comp-chips { display: flex; flex-wrap: wrap; gap: var(--space-s2); }
      .comp-chip { font-size: 12px; padding: 3px 10px; border-radius: var(--shape-radius-full); border: 0.5px solid var(--color-surface-outline-variant); }
      .comp-chip.live, .cov-dot.live { background: var(--color-schemes-primary-container, #ddb7ff); color: var(--color-schemes-on-primary-container, #2c0051); border-color: transparent; }
      .comp-chip.code, .cov-dot.code { background: var(--color-surface-surface-container-high, #e4e4e7); color: var(--color-surface-on-surface, #09090b); }
      .comp-chip.figma, .cov-dot.figma { background: transparent; color: var(--color-surface-on-surface-variant, #3f3f46); border-style: dashed; }
      .cov-dot.code { background: var(--color-surface-on-surface-variant); }
      .cov-dot.figma { background: var(--color-surface-outline); }

      .pg-card { padding: 0; overflow: hidden; }
      .pg-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-s3);
        padding: var(--space-s3) var(--space-s4); border-bottom: 0.5px solid var(--color-surface-outline-variant); }
      .pg-src { font-size: 11px; color: var(--color-surface-on-surface-variant); }
      .pg-open { font-size: 12px; font-weight: 600; color: var(--color-surface-on-surface); text-decoration: none; }
      .pg-frame { width: 100%; height: 720px; border: 0; display: block; background: #fff; }
      .pg-hint { border-radius: 0; margin: 0; }

      /* ---------- Typography ---------- */
      .type-row { display: flex; align-items: baseline; gap: var(--space-s5); padding: var(--space-s4) 0;
        border-top: 0.5px solid var(--color-surface-outline-variant); flex-wrap: wrap; }
      .type-row:first-child { border-top: 0; }
      .type-meta { flex: none; width: 220px; }
      .type-meta .nm { font-size: 13px; font-weight: 700; }
      .type-meta .sp { font-size: 11px; color: var(--color-surface-on-surface-variant); margin-top: 3px; }
      .type-sample { flex: 1; min-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .font-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: var(--shape-radius-full);
        vertical-align: middle; margin-left: 4px; }
      .font-badge.brand { background: var(--color-schemes-primary-container, #ddb7ff); color: var(--color-schemes-on-primary-container, #2c0051); }
      .font-badge.plain { background: var(--color-surface-surface-container-high, #e4e4e7); color: var(--color-surface-on-surface-variant, #3f3f46); }

      /* ---------- Radius ---------- */
      .radius-grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
      .radius-card { text-align: center; }
      .radius-demo { height: 96px; background: color-mix(in srgb, var(--color-surface-inverse-surface) 8%, transparent);
        border: 1.5px solid var(--color-surface-on-surface); margin-bottom: var(--space-s3); }
      .radius-card .nm { font-size: 12px; font-weight: 700; }
      .radius-card .px { font-size: 11px; color: var(--color-surface-on-surface-variant); }

      /* ---------- Spacing ---------- */
      .space-row { display: flex; align-items: center; gap: var(--space-s4); padding: var(--space-s2) 0; }
      .space-key { width: 56px; flex: none; font-weight: 700; font-size: 13px; }
      .space-bar { height: 18px; border-radius: var(--shape-radius-4); background: var(--color-surface-inverse-surface); flex: none;
        min-width: 1px; transition: width 600ms cubic-bezier(0.23, 1, 0.32, 1); }
      .space-px { font-size: 12px; color: var(--color-surface-on-surface-variant); }
      .space-demo { display: flex; gap: var(--space-s4); flex-wrap: wrap; margin-top: var(--space-s5); }
      .space-demo .box { background: color-mix(in srgb, var(--color-surface-inverse-surface) 8%, transparent);
        border: 1px dashed color-mix(in srgb, var(--color-surface-on-surface) 45%, transparent); border-radius: var(--shape-radius-8); }
      .space-demo .box i { display: block; background: var(--color-surface-inverse-surface); border-radius: var(--shape-radius-4); height: 40px; }

      /* ---------- Motion ---------- */
      .motion-grid { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
      .demo-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-s4); gap: var(--space-s3); }
      .demo-head h4 { margin: 0; font-size: 15px; font-weight: 700; }
      .stage { position: relative; height: 132px; border-radius: var(--shape-radius-16);
        background: var(--color-surface-background); overflow: hidden; display: grid; place-items: center; }
      .mover { width: 56px; height: 56px; border-radius: var(--shape-radius-12);
        background: var(--color-surface-inverse-surface); box-shadow: 0 10px 24px color-mix(in srgb, var(--color-surface-inverse-surface) 28%, transparent); }
      .ba { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-s3); }

      .easing-list { display: grid; gap: var(--space-s2); }

      /* 动效扩展 */

      .flicker-row, .origin-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-s3); }

      .origin-wrap { position: relative; height: 120px; background: var(--color-surface-background); border-radius: var(--shape-radius-12); display: grid; place-items: center; }
      .origin-pop { width: 74%; padding: var(--space-s3); background: var(--color-surface-surface-container-lowest);
        border: 0.5px solid var(--color-surface-outline-variant); border-radius: var(--shape-radius-12); font-size: 12px; text-align: center; color: var(--color-surface-on-surface); }
      .origin-pop[data-origin="center"] { transform-origin: center; }
      .origin-pop[data-origin="trigger"] { transform-origin: top left; }

      .tips-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .tips-table td { padding: 9px 10px; border-top: 0.5px solid var(--color-surface-outline-variant); vertical-align: top; line-height: 1.5; }
      .tips-table tr:first-child td { border-top: 0; }

      /* 通用小按钮（演示用，非真实组件） */

      .rb.primary { background: var(--color-schemes-primary); color: var(--color-schemes-on-primary); border-color: transparent; }
      .rb.inverse { background: var(--color-surface-inverse-surface); color: var(--color-surface-inverse-on-surface); border-color: transparent; }
      .rb.ghost { background: transparent; color: var(--color-surface-on-surface-variant); }

      /* ---------- 气质 Character ---------- */
      .char-grid { grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); }
      .char-card { display: flex; flex-direction: column; gap: var(--space-s2); padding: var(--space-s4); }
      .char-k { font-size: 15px; font-weight: 700; }
      .char-t { font-size: 13px; line-height: 1.6; color: var(--color-surface-on-surface-variant); flex: 1; }

        background: var(--color-surface-background); color: var(--color-surface-on-surface-variant); }
      .prim-card { padding: var(--space-s6); }

      .prim-lead b { color: var(--color-surface-on-surface); }

      .prim-demo { border-radius: var(--shape-radius-16); padding: var(--space-s4); }
      .prim-demo.ok { background: color-mix(in srgb, var(--color-surface-inverse-surface) 6%, transparent); }
      .prim-demo.accent { background: color-mix(in srgb, var(--color-schemes-primary) 8%, transparent); }

      @media (max-width: 720px) { .prim-demos { grid-template-columns: 1fr; } }

      /* ---------- 布局 Layout ---------- */

      .hier-card { display: flex; flex-direction: column; gap: var(--space-s4); align-items: flex-start; padding: var(--space-s8); background: var(--color-surface-surface); }
      .hier-display { font-family: var(--font-family-brand, var(--font-family-plain)); font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; }

      .share-row { display: flex; gap: var(--space-s4); padding: var(--space-s3) 0; border-top: 0.5px solid var(--color-surface-outline-variant); }

      /* ---------- 深度 Elevation ---------- */
      .elev-grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

      .icon-search:focus { border-color: var(--color-surface-on-surface); }
      .icon-status { font-size: 12px; color: var(--color-surface-on-surface-variant); white-space: nowrap; }
      .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(94px, 1fr)); gap: var(--space-s3); }
      .icon-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: var(--space-s4) 6px;

      .icon-name { font-size: 11px; line-height: 1.3; color: var(--color-surface-on-surface-variant); text-align: center;

      .note { display: flex; gap: var(--space-s3); padding: var(--space-s4); border-radius: var(--shape-radius-12);

      .note b { color: var(--color-surface-on-surface); }

      .skill-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }

        .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; }

        .nav-label { display: none; }
